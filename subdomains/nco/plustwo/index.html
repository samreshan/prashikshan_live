 <!-- Bootstrap Cards to Hold PDF Pages -->
<div class="container mt-4">
    <!-- First PDF Viewer -->
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5>Orientation Slides</h5>
        <div>
          <button class="btn btn-primary btn-sm show-all-btn">Show All</button>
          <button class="btn btn-secondary btn-sm show-less-btn" style="display: none;">Show Less</button>
        </div>

    <!-- Second PDF Viewer -->
    <div class="card mt-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5>Rules and Regulations</h5>
        <div>
          <button class="btn btn-primary btn-sm show-all-btn">Show All</button>
          <button class="btn btn-secondary btn-sm show-less-btn" style="display: none;">Show Less</button>
        </div>
      </div>

  <!-- Include PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const pdfContainers = document.querySelectorAll(".pdf-container");
  
      pdfContainers.forEach(container => {
        const pdfUrl = container.dataset.pdf;
        const showAllBtn = container.parentElement.querySelector(".show-all-btn");
        const showLessBtn = container.parentElement.querySelector(".show-less-btn");
        let pdfDoc = null;
        let allPagesLoaded = false; // Track if all pages are loaded
  
        function renderPage(pdf, pageNum, clearContainer = false) {
          if (clearContainer) container.innerHTML = ""; // Clear previous content
  
          pdf.getPage(pageNum).then(page => {
            const scale = 1.5;
            const viewport = page.getViewport({ scale });
  
            // Create a canvas for each page
            const canvas = document.createElement("canvas");
            canvas.className = "pdf-page";
            canvas.style.width = "100%";
            canvas.style.display = "block";
            canvas.style.marginBottom = "10px";
            container.appendChild(canvas);
  
            const context = canvas.getContext("2d");
            canvas.height = viewport.height;
            canvas.width = viewport.width;
  
            const renderContext = {
              canvasContext: context,
              viewport: viewport,
            };
  
            page.render(renderContext);
          });
        }
  
        // Load the first page initially
        pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
          pdfDoc = pdf;
          renderPage(pdf, 1);
        }).catch(error => {
          console.error("Error loading PDF:", error);
          container.innerHTML = `<p style="color: red;">Failed to load the PDF. Check the file path.</p>`;
        });
  
        // Show all pages when the button is clicked
        showAllBtn.addEventListener("click", function () {
          if (allPagesLoaded) return; // Prevent duplicate loading
  
         if (pdfDoc) {
           for (let pageNum = 2; pageNum <= pdfDoc.numPages; pageNum++) {
            renderPage(pdfDoc, pageNum);
           }
           allPagesLoaded = true;
          showAllBtn.style.display = "none"; // Hide Show All button
           showLessBtn.style.display = "inline-block"; // Show Show Less button
         }
         });
  
        // Show only the first page when "Show Less" is clicked
        showLessBtn.addEventListener("click", function () {
          if (pdfDoc) {
            renderPage(pdfDoc, 1, true);
            allPagesLoaded = false;
            showLessBtn.style.display = "none"; // Hide Show Less button
            showAllBtn.style.display = "inline-block"; // Show Show All button
          }
        });
      });
    });
  </script>
