<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSprout - National Seed Fund Program</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
        integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
        crossorigin="anonymous" referrerpolicy="no-referrer" 
    />

    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <!-- Navigation -->
    <header class="navigation" id="navbar">
        <div class="container">
            <nav class="navbar">
                <div class="logo" id="logo"></div>
                
                <ul class="nav-links" id="navLinks"></ul>
                
                <button class="register-btn" id="registerBtn">Register Now</button>
                
                <div class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="hero">
        <div class="container">
            <div class="hero-content" id="heroContent"></div>
        </div>
    </section>

    <!-- Dynamic Sections Container -->
    <main id="sectionsContainer"></main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-logo"><img src="images/isproutLogo.png" width="80px" alt=""></div>
            <p>&copy; 2025 iSprout - National Student Seed Fund Program. All rights reserved.</p>
            <p style="opacity: 0.8; margin-top: 0.5rem;">Empowering Nepal's next generation of entrepreneurs</p>
        </div>
    </footer>

    <!-- Scroll to Top Button -->
    <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="./script.js"></script>

</body>
</html>
